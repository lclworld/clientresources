:root{--brown:#3B1E0E;--soft:#8A5A3C;--line:#ECDCCF;--or:#F0873A;--ink:#1E120B;--orbg:#FFF1E8;--ok:#2E7D32;--err:#C0392B}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--brown);font-family:Poppins,sans-serif;font-size:16px;line-height:1.5}
#lcls{max-width:1220px;margin:0 auto;padding:28px 20px 80px}
#lcls h1{font-size:52px;line-height:1.04;margin:0 0 14px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
#lcls .lead{font-size:19px;color:#7A6A60;margin:0 0 34px;max-width:660px}

.hdr{background:#fff;box-shadow:0 2px 14px rgba(59,30,14,.07);padding:14px 24px;position:relative;z-index:40}
.hdr img{display:block;height:54px;width:auto;max-width:100%}
#lcls .badge{display:inline-block;background:var(--orbg);border:1.5px solid #F8D9C2;color:var(--or);border-radius:999px;padding:7px 20px;font-size:12.5px;font-weight:700;letter-spacing:.22em;margin:6px 0 18px}
#lcls h1 .acc{color:var(--or)}
#lcls .eb{font-size:12.5px;font-weight:700;letter-spacing:.24em;color:var(--or);margin:0 0 6px;text-transform:uppercase}
#lcls .grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:44px;align-items:start}
#lcls .sec{padding:26px 0;border-top:1px solid var(--line)}
#lcls .sec:first-child{border-top:0;padding-top:0}
#lcls h2{font-size:28px;margin:0 0 6px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
#lcls .hint{font-size:15px;color:var(--soft);margin:0 0 14px}
#lcls label.f{display:block;font-weight:500;margin:14px 0 6px;font-size:15px}
#lcls .req{color:var(--or)}
#lcls input[type=text],#lcls input[type=email],#lcls input[type=tel],#lcls select,#lcls textarea{width:100%;font:inherit;color:var(--brown);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;background:#fff;outline:none}
#lcls textarea{min-height:92px;resize:vertical}
#lcls input:focus,#lcls select:focus,#lcls textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(224,102,26,.15)}
#lcls .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#lcls .err{color:var(--err);font-size:14px;margin-top:5px;min-height:0}
#lcls .bad{border-color:var(--err)!important}
#lcls .chips{display:flex;flex-wrap:wrap;gap:12px}
#lcls .chip{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;font:inherit;color:var(--brown);display:flex;align-items:center;gap:10px}
#lcls .chip[aria-pressed=true],#lcls .chip.on{border-color:var(--or);background:var(--orbg)}
#lcls .dot{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block;flex:none}
#lcls .sub{font-weight:500;font-size:15px;margin:16px 0 8px}
#lcls .ltype{display:flex;gap:14px;flex-wrap:wrap}
#lcls .lt{flex:1 1 180px;border:1.5px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;background:#fff;font:inherit;color:var(--brown);text-align:center}
#lcls .lt[aria-pressed=true]{border-color:var(--or);background:var(--orbg)}
#lcls .lt[disabled]{opacity:.35;cursor:not-allowed}
#lcls .lt svg{display:block;margin:0 auto 8px}
#lcls .lt b{font-weight:600;display:block}
#lcls .lt span{font-size:14px;color:var(--soft)}
#lcls .check{display:flex;gap:12px;align-items:flex-start;margin-top:14px;cursor:pointer}
#lcls .check input{width:22px;height:22px;accent-color:var(--or);flex:none;margin-top:2px}
#lcls .check b{font-weight:500}
#lcls .check span{display:block;font-size:14px;color:var(--soft)}
#lcls .designs{display:flex;flex-wrap:wrap;gap:14px}
#lcls .dz{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:0;font:inherit;color:var(--brown);width:92px}
#lcls .dz i{width:62px;height:62px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);display:block}
#lcls .dz[aria-pressed=true] i{box-shadow:0 0 0 3px var(--or)}
#lcls .dz span{font-size:13px;text-align:center;line-height:1.25}
#lcls .own{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
#lcls .col{display:flex;gap:10px;align-items:center}
#lcls .col input[type=color]{width:46px;height:46px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:#fff;flex:none;cursor:pointer}
#lcls .col input[type=text]{flex:1;min-width:0}
#lcls .fonts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#lcls .fp{border:1.5px solid var(--line);border-radius:22px;padding:16px 16px 14px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:var(--brown);position:relative;min-height:112px}
#lcls .fp[aria-pressed=true]{border-color:var(--or);background:var(--orbg)}
#lcls .fp em{position:absolute;top:10px;right:12px;font-style:normal;font-size:13px;font-weight:600;color:var(--or)}
#lcls .fp .a{font-size:30px;line-height:1.15;display:block;margin:4px 0 6px}
#lcls .fp .b{font-size:15px;display:block;color:var(--brown)}
#lcls .seg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#lcls .file{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#lcls .btn{background:var(--or);color:#fff;border:0;border-radius:999px;padding:16px 36px;font:inherit;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px rgba(240,135,58,.28)}
#lcls .btn:disabled{opacity:.55;cursor:wait}
#lcls .btn.ghost{background:#fff;color:var(--brown);border:1.5px solid #D9CBC0;font-size:13px;padding:13px 26px;box-shadow:none}
#lcls .btn.small{font-size:12px;padding:10px 20px}
#lcls .thumb{height:52px;max-width:140px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#f3ece6 0 25%,#fff 0 50%) 0 0/14px 14px;padding:4px}
#lcls .note{font-size:14px;color:var(--soft);margin-top:8px}
#lcls .pblock{border:1.5px solid var(--line);border-radius:32px;padding:10px 32px 16px;margin-bottom:28px;box-shadow:0 10px 34px rgba(59,30,14,.06)}
#lcls .pblock.active{border-color:var(--or)}
#lcls .phead{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px}
#lcls .phead b{font-size:19px;font-weight:700}
#lcls .link{background:none;border:0;color:var(--or);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline;padding:0}
#lcls aside{position:sticky;top:16px}
#lcls .pv{border:1.5px solid var(--line);border-radius:32px;box-shadow:0 10px 34px rgba(59,30,14,.08);padding:18px 18px 16px;background:#fff}
#lcls .pv h3{margin:0 0 2px;font-size:18px;font-weight:600}
#lcls .pv .who{font-size:14px;color:var(--soft);margin-bottom:10px}
#lcls .stagewrap{display:flex;align-items:flex-end;justify-content:center;gap:18px;background:#fff;min-height:200px;padding:6px 0 4px}
#lcls .stage{position:relative;flex:none}
#lcls .stage img.cont{display:block;height:100%;width:100%}
#lcls .stage .lbox{position:absolute;overflow:hidden}
#lcls .plain{display:flex;align-items:center;justify-content:center;background:#F7F1EC;border-radius:14px}
#lcls .lab{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
#lcls .lab.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 16%,rgba(255,255,255,.12) 30%,rgba(0,0,0,0) 56%,rgba(0,0,0,.16));pointer-events:none}
#lcls .lab .z{width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
#lcls .lab .t{white-space:nowrap;display:block;max-width:100%}
#lcls .lab .w{white-space:normal;line-height:1.08;word-break:break-word;display:block;max-width:100%}
#lcls .lab img{max-width:100%;max-height:100%;object-fit:contain}
#lcls .lab .ln{height:7px;border-radius:4px;margin:6px 0;opacity:.28}
#lcls .lid{position:relative;flex:none}
#lcls .close{margin-top:14px;padding:0 4px}
#lcls .cap{background:#fff;padding:4px 0 8px}
#lcls .lid{border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
#lcls .lid .lab{box-shadow:none}
#lcls .seg2{display:flex;gap:8px;justify-content:center;margin:6px 0 8px}
#lcls .seg2 button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 18px;font:inherit;font-size:14px;cursor:pointer;color:var(--brown)}
#lcls .seg2 button[aria-pressed=true]{border-color:var(--or);background:var(--orbg)}
#lcls .det{border-top:1px solid var(--line);margin-top:10px;padding-top:12px;font-size:14px}
#lcls .det div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
#lcls .det span:first-child{color:var(--soft)}
#lcls .det .sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:6px}
#lcls .own-card{background:#FBF6F2;border-radius:28px;padding:22px 24px;margin-top:8px}
#lcls .own-card h2{font-size:20px}
#lcls .own-card ul{margin:8px 0 0;padding-left:20px;columns:2;column-gap:28px;font-size:14.5px}
#lcls .own-card li{break-inside:avoid;margin-bottom:4px}
#lcls .banner{border-radius:18px;padding:14px 18px;margin-top:14px;font-size:15px}
#lcls .banner.bad{background:#FDECEA;color:var(--err)}
#lcls .done{text-align:center;padding:90px 20px}
#lcls .done h1{font-size:48px}
#lcls .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#lcls .okc{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;background:var(--orbg);display:flex;align-items:center;justify-content:center}
#lcls .okc svg{width:44px;height:44px;stroke:var(--or);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:920px){
 #lcls{padding:16px 16px 70px}
 #lcls h1{font-size:36px}
 .hdr{padding:12px 16px}
 .hdr img{height:44px}
 #lcls h2{font-size:24px}
 #lcls .grid{grid-template-columns:1fr;gap:0}
 #lcls aside{order:-1;position:sticky;top:0;z-index:30;margin:0 -16px 16px}
 #lcls .pv{border-radius:0 0 20px 20px;border-width:0 0 1.5px;padding:10px 16px 10px;box-shadow:0 6px 18px rgba(59,30,14,.08)}
 #lcls .stagewrap{min-height:0}
 #lcls .pv h3,#lcls .det,#lcls .close{display:none}
 #lcls .pv .who{margin-bottom:4px}
 #lcls .fonts,#lcls .row2,#lcls .own{grid-template-columns:1fr}
 #lcls .own-card ul{columns:1}
 #lcls .pblock{padding:2px 16px 8px}
}
</style></head>

/* ---------- events ---------- */

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a],#addp,#send");if(!t||!$("#lcls").contains(t))return;
  if(t.id==="addp"){var np=newP(S.ps[S.ps.length-1]);np.logoMode=S.ps[0].logoMode;np.logoText=S.ps[0].logoText;np.logoFile=S.ps[0].logoFile;np.logoScale=S.ps[0].logoScale;np.logoY=S.ps[0].logoY;np.design=S.ps[0].design;np.bg=S.ps[0].bg;np.fg=S.ps[0].fg;np.font=S.ps[0].font;S.ps.push(np);S.act=S.ps.length-1;renderKeep();setTimeout(function(){var b=$$(".pblock").pop();if(b)b.scrollIntoView({behavior:"smooth",block:"start"});},30);return;}

document.addEventListener("input",function(e){
  var t=e.target;if(!t.closest||!t.closest("#lcls"))return;
  var id=t.id;
  function ce(k){S[k]="";var q=$("[data-e="+({eb:"brand",en:"name",ee:"email",eo:"order"}[k])+"]");if(q)q.textContent="";}
  if(id==="brand"){S.brand=t.value;ce("eb");return;}if(id==="cname"){S.name=t.value;ce("en");return;}if(id==="email"){S.email=t.value;ce("ee");return;}

  var a=t.dataset.a;if(!a)return;var i=idx(t),p=S.ps[i];if(!p)return;

  else if(a==="fgt"||a==="bgt"){var val=t.value.trim();if(val[0]!=="#")val="#"+val;if(!hexOk(val))return;if(a==="fgt")p.fg=val.toUpperCase();else p.bg=val.toUpperCase();p.design="Own colors";var c=$("[data-a="+(a==="fgt"?"fgc":"bgc")+"]",t.closest(".col").parentNode);var q2=$("[data-a="+(a==="fgt"?"fgc":"bgc")+"]",t.closest(".col"));if(q2)q2.value=p[a==="fgt"?"fg":"bg"].toLowerCase();$$(".dz",t.closest(".pblock")).forEach(function(b){b.setAttribute("aria-pressed","false");});}
  else return;

document.addEventListener("change",function(e){
  var t=e.target;if(!t.closest||!t.closest("#lcls"))return;var a=t.dataset.a;if(!a)return;var i=idx(t),p=S.ps[i];if(!p)return;S.act=i;
  if(a==="pack"){p.pack=t.value;p.err.pack="";p.size="";p.cap="";p.lt="";p.lid=false;var k=pk(t.value);if(k&&k.sizes.length===1)p.size=k.sizes[0];var b=bodiesFor(p);p.body=b.indexOf("W")>-1?"W":(b[0]||"W");if(k&&k.labels.length===1)p.lt=k.labels[0];renderKeep();return;}
  if(a==="size"){p.size=t.value?+t.value:"";p.err.size="";var b2=bodiesFor(p);if(b2.indexOf(p.body)<0)p.body=b2[0]||"W";renderKeep();return;}

    var rd=new FileReader();rd.onload=function(){var url=rd.result,im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=Math.min(im.width,200);c.height=Math.min(im.height,200);var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height).data,al=false;for(var q=3;q<d.length;q+=4){if(d[q]<250){al=true;break;}}
      p.logoFile={name:f.name,url:url,data:url.split(",")[1],alpha:al,ratio:im.width/im.height};p.logoScale=1;p.logoY=0;p.err.logo="";renderKeep();};im.src=url;};rd.readAsDataURL(f);}

/* ---------- submit ---------- */
function validate(){
  var ok=true,first=null;
  S.ps.forEach(function(p,i){p.err={};
    var k=pk(p.pack);
    if(!p.pack){p.err.pack="Please choose your packaging.";ok=false;}
    if(k&&k.sizes.length&&!p.size){p.err.size="Please choose your size.";ok=false;}
    if(!p.lt){p.err.lt="Please choose a label type.";ok=false;}
    if(p.logoMode==="upload"&&!p.logoFile){p.err.logo="Please upload your logo, or type your brand name instead.";ok=false;}
    if(p.logoMode==="type"&&!p.logoText.trim()){p.err.logo="Please type your brand name, or upload your logo instead.";ok=false;}
    if(!p.product.trim()){p.err.product="Please add the name of your product.";ok=false;}
    if(!p.dist.trim()){p.err.dist="Please add your distributor details.";ok=false;}
  });
  S.eb=S.en=S.ee=S.eo="";
  if(!S.brand.trim()){S.eb="Please add your brand name.";ok=false;}
  if(!S.name.trim()){S.en="Please add your name.";ok=false;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email.trim())){S.ee="Please add a valid email.";ok=false;}
  if(!S.order.trim()){S.eo="Please add your InstaBrand order code.";ok=false;}
  return ok;
}
function snap(p){
  var out=[],sh=shapeOf(p),views=sh.t==="fb"?["front","back"]:["front"],cur=p.view,idx0=S.act,prev=S.act;
  return views.reduce(function(chain,v){return chain.then(function(){
    S.act=S.ps.indexOf(p);p.view=v;drawPreview();
    return window.__wrapReady.then(function(){return new Promise(function(r){setTimeout(r,150);});}).then(function(){
      var el=$(".cap");return window.html2canvas(el,{backgroundColor:"#ffffff",scale:2,logging:false}).then(function(c){out.push({name:v,type:"image/png",data:c.toDataURL("image/png").split(",")[1]});});
    });});},Promise.resolve()).then(function(){p.view=cur;S.act=prev;drawPreview();return out;});
}
function submit(){
  if(S.sending)return;S.banner="";
  if(!validate()){renderKeep();var e=$(".err:not(:empty)");if(e)e.scrollIntoView({behavior:"smooth",block:"center"});return;}
  S.sending=true;renderKeep();
  var prods=[];
  S.ps.reduce(function(chain,p){return chain.then(function(){return snap(p).then(function(pv){
    var k=pk(p.pack);
    prods.push({packaging:k.name,size:sizeTxt(p),panels:p.size?panels(p):"",containerColor:k.own?"Own packaging":COL[p.body],capColor:k.caps?COL[capFor(p)]:"",
      labelType:p.lt==="wrap"?"Wrap around":"Front and back",lid:!!(k.lid&&p.lid),box:p.box,design:p.design,bg:p.bg,fg:p.fg,
      font:PAIRS[p.font-1].n+". "+PAIRS[p.font-1].name,logoSize:p.logoMode==='upload'?Math.round((p.logoScale||1)*100)+'%':'',logoMode:p.logoMode,logoText:p.logoMode==="type"?p.logoText.trim():"",
      logo:p.logoMode==="upload"&&p.logoFile?{name:p.logoFile.name,type:"image/png",data:p.logoFile.data}:null,
      desc:{product:p.product.trim(),generic:p.generic.trim(),note:p.note.trim(),distributor:p.dist.trim()},previews:pv});});});},Promise.resolve())
  .then(function(){
    var payload={website:$("#website")?$("#website").value:"",brand:S.brand.trim(),contactName:S.name.trim(),email:S.email.trim(),phone:S.phone.trim(),orderCode:S.order.trim(),notes:S.notes.trim(),products:prods};
    if(!CONFIG.SCRIPT_URL||CONFIG.SCRIPT_URL.indexOf("PASTE_")===0)throw new Error("not connected");
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},90000);
    return fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),signal:ctl.signal}).then(function(r){clearTimeout(to);return r.json();});
  }).then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||"failed");S.sending=false;S.done=true;render();})
  .catch(function(e){S.sending=false;var why=(e&&e.message)||"unknown";S.banner="Sorry, that did not go through. Please email your choices to "+CONFIG.EMAIL+" and we will take it from there. (Reason: "+why+")";renderKeep();});
}
render();
window.__S=S;
})();
